# Nginx 是反向代理服务器。
#
# 当前部署拓扑：
#   客户端 -> 宿主机:8080 -> Nginx 容器:8080
#          -> 宿主机 Go:8081 或 Go:8082
#
# 反向代理的关键点：
# - 客户端只需要知道 Nginx 的统一入口；
# - Nginx 决定请求转发给哪个后端实例；
# - 客户端通常不需要直接暴露 Go 的真实端口。

# worker_processes 控制 Nginx worker 进程数量。
# 这里写 1 便于本地学习；生产环境常根据 CPU 核数和负载配置。
worker_processes  1;

events {
    # 一个 worker 最多同时处理的连接数配置。
    # 连接数不是 QPS：一个连接可能保持较久，也可能承载多个 HTTP 请求。
    worker_connections  1024;
}

http {
    # http 块放全局 HTTP 能力，例如 MIME、连接复用、server、upstream。
    include       mime.types;
    # 没有匹配到更具体类型时，响应默认按 JSON 处理。
    default_type  application/json;

    # 是否使用零拷贝/高效文件发送。静态文件服务场景更明显，
    # 反向代理场景先记住它是 HTTP 全局性能配置即可。
    sendfile        on;

    # Keep-Alive 是 TCP 连接复用：一个连接可以承载多个 HTTP 请求，
    # 减少每个请求重新建立 TCP 连接的成本。
    keepalive_timeout  65;

    # server 表示一个虚拟主机/监听入口。
    server {
        # Nginx 容器监听 8080；Compose 的 "8080:8080" 再把它映射到宿主机 8080。
        listen       8080;
        # 本地请求没有复杂域名匹配时可以写 localhost。
        server_name  localhost;

        # 如果 Nginx 同时负责前端静态文件，可以启用类似下面的 location。
        # root 指向容器内目录，不是宿主机目录；要使用它还需要额外 volume 挂载。
#         location / {
#             root   html/hmdp;
#             index  index.html index.htm;
#         }

#         # 可把上游 5xx 映射到自定义错误页面。
#         error_page   500 502 503 504  /50x.html;
#         location = /50x.html {
#             root   html;
#         }

        # 精确匹配根路径。访问 http://127.0.0.1:8080/ 时，
        # 不转发给 Go，而是返回 302，让浏览器跳到 Swagger 页面。
        location = / {
                return 302 /swagger/index.html;
            }

        # 前缀匹配：所有以 /api 开头的请求进入这里。
        # 例如客户端请求 /api/user/me。
        location /api {
            # 这个 location 的响应默认按 JSON 处理，适合后端 API。
            default_type  application/json;

            # internal 表示只允许 Nginx 内部跳转访问；
            # 当前被注释，说明客户端可以直接访问 /api。
            #internal;

            # 代理连接的 Keep-Alive 配置。
            keepalive_timeout   30s;
            keepalive_requests  1000;

            # Nginx 到上游 Go 服务使用 HTTP/1.1。
            # HTTP/1.1 支持连接复用，也是常见的代理配置。
            proxy_http_version 1.1;

            # 去掉对外暴露的 /api 前缀：
            # /api/user/me -> /user/me。
            # 这样 Go 的 Gin 路由只需注册 /user/me。
            rewrite /api(/.*) $1 break;

            # 把客户端请求头转发给上游。
            # 这很重要：Authorization: Bearer <token> 会随请求到达 Go，
            # Go 的 RefreshToken 中间件才能读取并查询 Redis。
            proxy_pass_request_headers on;

            # 发生连接错误或超时时，允许尝试 upstream 中的其他后端。
            # 这里只配置了 error 和 timeout，不等于所有 5xx 都会重试。
            proxy_next_upstream error timeout;

            # 也可以直接写死一个后端，但这样不能自然扩展多实例：
#             proxy_pass http://127.0.0.1:8081;

            # 使用下面定义的 backend upstream。
            # Nginx 会从 backend 中选择一个可用的 Go 实例。
            proxy_pass http://backend;
        }
    }

    # upstream 给一组后端服务起一个逻辑名字。
    # proxy_pass http://backend 会把请求交给这里的服务器列表。
    upstream backend {
        # 这两行是“宿主机上的 Go 实例”，不是 Nginx 容器内部的 127.0.0.1。
        # host.docker.internal 是 Docker 容器访问宿主机的特殊主机名。
        # 因为当前 Go 没有放进 Compose，所以不能写 backend:8081。
        server host.docker.internal:8081 max_fails=5 fail_timeout=10s weight=1;
        server host.docker.internal:8082 max_fails=5 fail_timeout=10s weight=1;

        # 如果 Go 也作为 Compose 服务 backend 运行，应改成类似：
        # server backend:8081;
        # 这里的 backend 是 Compose 服务名，8081 是 Go 容器内部端口。

        # max_fails=5：在 fail_timeout 时间窗口内失败达到 5 次，
        # Nginx 会暂时认为该后端不可用。
        # fail_timeout=10s：失败统计/暂时摘除的时间窗口。
        # weight=1：负载均衡权重；权重更高的实例通常会收到更多请求。
    }
}
