services:
  mysql:
    image: mariadb
    hostname: mysql
    container_name: mysql
    ports:
      # 宿主机 3306 -> MySQL 容器 3306；冒号左边是宿主机端口。
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=123
      - MYSQL_DATABASE=hmdp
    volumes:
      - ./hmdp.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:alpine
    hostname: redis
    container_name: redis
    ports:
      # 宿主机 6379 -> Redis 容器 6379。
      - "6379:6379"
    command: [ "redis-server", "--requirepass 123321" ]

#  redis2:
#    image: redis:alpine
#    hostname: redis2
#    container_name: redis2
#    ports:
#      - "6380:6379"
#
#  redis3:
#    image: redis:alpine
#    hostname: redis3
#    container_name: redis3
#    ports:
#      - "6381:6379"

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      # 宿主机 8080 -> Nginx 容器 8080；外部入口通常先访问这里。
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - redis
      - mysql
